<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
  <title>Circle Grid Notes — Figma Layout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#90A9A9;
      --white:255,255,255;
      --ink:#0b0b0b;
      --safeTop: env(safe-area-inset-top, 0px);
      --safeBot: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:'Montserrat',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    body{position:fixed;inset:0;touch-action:none}
    .phone{position:relative;width:100vw;height:100svh;background:var(--bg);overflow:hidden;touch-action:none}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

    .topPickers{position:absolute;top:calc(var(--topY,98px) + var(--safeTop));left:0;right:0;display:grid;grid-template-columns:1fr 1fr;align-items:start;width:var(--topW,356px);margin:0 auto;z-index:5;pointer-events:none}
    .divider{display:none}
    .pickerBox{height:var(--pickerH,285px);display:flex;flex-direction:column;align-items:center;pointer-events:auto;touch-action:none}
    .pickerTitle{font-size:var(--titleFs,18px);letter-spacing:.07em;font-weight:400;line-height:1;color:rgba(var(--white),.92);text-transform:uppercase;margin-bottom:var(--titleMb,30px);white-space:nowrap}
    .subPicker .pickerTitle{color:rgba(11,11,11,.78)}
    .wheel{position:relative;width:var(--wheelW,150px);height:var(--wheelH,178px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--wheelGap,28px);overflow:hidden;cursor:ns-resize}
    .pickItem{height:var(--pickH,44px);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--pickFs,34px);line-height:1;color:rgba(var(--white),.18);transition:opacity .16s,transform .16s,font-weight .16s,color .16s}
    .pickItem.active{color:rgba(var(--white),.98);font-weight:900;transform:scale(1.03)}
    .pickItem.near{color:rgba(var(--white),.18);font-weight:800;transform:scale(.94)}
    .subWheel .pickItem{height:58px}
    .subIcon{display:block;max-width:76px;max-height:62px;filter:none;opacity:inherit}
    .pickItem.active .subIcon{opacity:1}

    .bottomBar{position:absolute;left:50%;bottom:calc(var(--bottomY,69px) + var(--safeBot));transform:translateX(-50%);width:var(--bottomW,378px);height:var(--bottomH,112px);border:1px solid rgba(var(--white),.86);border-radius:var(--bottomR,56px);display:grid;grid-template-columns:1.15fr .72fr 1.15fr;overflow:hidden;z-index:8;color:rgba(var(--white),.72);background:transparent;pointer-events:auto}
    .seg{border:0;background:transparent;color:inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:left;font-size:var(--segFs,19px);line-height:1.22;letter-spacing:.05em;font-weight:400;cursor:pointer;touch-action:manipulation}
    .seg + .seg{border-left:1px solid rgba(var(--white),.68)}
    .seg.active{color:rgba(var(--white),.98);font-weight:800}
    .seg:active{transform:scale(.99)}
    .hamb{display:flex;flex-direction:column;gap:13px;align-items:center;justify-content:center}
    .hamb span{width:var(--hambW,42px);height:3px;border-radius:99px;background:rgba(var(--white),.90)}
    .bottomDropdown{position:absolute;left:50%;bottom:calc(var(--dropY,190px) + var(--safeBot));transform:translateX(-50%);width:196px;border-radius:20px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.12);overflow:hidden;display:none;z-index:12}
    .bottomDropdown.open{display:block}
    .ddItem{padding:16px 18px;color:rgba(255,255,255,.92);font-size:15px;font-weight:700;cursor:pointer}
    .ddItem + .ddItem{border-top:1px solid rgba(255,255,255,.1)}
    .ddItem.active{background:rgba(255,255,255,.10);color:rgba(255,255,255,1)}

    .modalOverlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
    .modalOverlay.open{display:flex}
    .modal{width:min(520px,100%);border-radius:18px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden}
    .modalHeader{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.10)}
    .modalTitle{font-size:16px;color:rgba(255,255,255,.92);font-weight:800}
    .modalClose{width:40px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10);cursor:pointer;color:#fff}
    .modalBody{padding:14px 16px 16px}
    .fieldLabel{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:8px}
    input[type=text]{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.12);outline:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);font-size:16px}
    .modalActions{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mBtn{height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;font-weight:900;font-size:14px;border:1px solid rgba(255,255,255,.10)}
    .mBtn.primary{background:rgba(255,255,255,.90);color:rgba(0,0,0,.82)} .mBtn.ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)} .mBtn.danger{background:rgba(220,40,40,.90);color:#fff}
    .libList{display:flex;flex-direction:column;gap:10px} .libItem{border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px} .libName{color:rgba(255,255,255,.92);font-weight:800;font-size:15px;line-height:1.1} .libMeta{margin-top:4px;color:rgba(255,255,255,.55);font-size:12px} .libBtns{display:flex;gap:8px;flex-shrink:0} .mini{height:36px;padding:0 10px;border-radius:12px;font-size:12px} .empty{color:rgba(255,255,255,.65);font-size:14px;padding:8px 2px}
    
  </style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="c"></canvas>
  <div class="topPickers" id="topPickers">
    <div class="pickerBox tsPicker" id="tsPicker"><div class="pickerTitle">Time Signature</div><div class="wheel" id="tsWheel"></div></div>
    <div class="divider"></div>
    <div class="pickerBox subPicker" id="subPicker"><div class="pickerTitle">Subdivision</div><div class="wheel subWheel" id="subWheel"></div></div>
  </div>
  <div class="bottomDropdown" id="dropdown"><div class="ddItem" id="savePatternItem">Save Pattern</div><div class="ddItem" id="libraryItem">Library</div><div class="ddItem" id="beatClickItem">Beat Click</div><div class="ddItem" id="clearPatternItem">Clear</div></div>
  <div class="bottomBar" id="bottomBar">
    <button class="seg" id="gridSnapBtn">GRID<br>SNAP</button>
    <button class="seg menuSeg" id="menuBtn" aria-label="Menu"><span class="hamb"><span></span><span></span><span></span></span></button>
    <button class="seg" id="groupBtn">GROUP<br>NOTES</button>
  </div>
  <div class="modalOverlay" id="saveModal"><div class="modal"><div class="modalHeader"><div class="modalTitle">Save Pattern</div><div class="modalClose" id="saveClose">✕</div></div><div class="modalBody"><div class="fieldLabel">Name</div><input id="saveName" type="text" maxlength="40" placeholder="e.g. Verse A / 7-3 clave / ..." /><div class="modalActions"><div class="mBtn ghost" id="saveCancel">Cancel</div><div class="mBtn primary" id="saveConfirm">Save</div></div></div></div></div>
  <div class="modalOverlay" id="bpmModal"><div class="modal"><div class="modalHeader"><div class="modalTitle">Tempo</div><div class="modalClose" id="bpmClose">✕</div></div><div class="modalBody"><div class="fieldLabel">BPM (30–240)</div><input id="bpmInput" type="text" inputmode="numeric" maxlength="3" placeholder="80" /><div class="modalActions"><div class="mBtn ghost" id="bpmCancel">Cancel</div><div class="mBtn primary" id="bpmConfirm">Set</div></div></div></div></div>
  <div class="modalOverlay" id="libModal"><div class="modal"><div class="modalHeader"><div class="modalTitle">Library</div><div class="modalClose" id="libClose">✕</div></div><div class="modalBody"><div class="libList" id="libList"></div><div class="modalActions" style="grid-template-columns:1fr"><div class="mBtn ghost" id="libCloseBtn">Close</div></div></div></div></div>
</div>

  function roundRectPath(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
  function drawArcShortest(a1,a2,cx,cy,R){const d=shortestAngleDiff(a2,a1);ctx.beginPath();ctx.arc(cx,cy,R,a1,a1+d,d<0);ctx.stroke()}
  function draw(){resize(false);ctx.clearRect(0,0,W,H);
    const c=dialCenter(),R=dialRadius(),s=layoutScale(),nr=noteRadius(),mr=markerRadii();
    const bandW=54*s,innerR=R*.72,total=beats*Math.max(1,subdiv),head=base+beatPos*(Math.PI*2/beats);
    // belső tárcsa: halvány korong + sűrű sugaras textúra
    ctx.fillStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.arc(c.x,c.y,R-bandW*.55,0,Math.PI*2);ctx.fill();
    ctx.lineCap='butt';ctx.lineWidth=Math.max(1,1.2*s);ctx.strokeStyle='rgba(255,255,255,.11)';ctx.beginPath();
    for(let i=0;i<200;i++){const a=i*(Math.PI*2/200);ctx.moveTo(c.x+Math.cos(a)*R*.30,c.y+Math.sin(a)*R*.30);ctx.lineTo(c.x+Math.cos(a)*R*.80,c.y+Math.sin(a)*R*.80)}
    ctx.stroke();
    // külső sáv + vonalkázás
    ctx.lineWidth=bandW;ctx.strokeStyle='rgba(255,255,255,.13)';ctx.beginPath();ctx.arc(c.x,c.y,R,0,Math.PI*2);ctx.stroke();
    // idő-impulzus: a sáv alapból sima, kizárólag a playhead mögötti csóva bordázott,
    // és csak lejátszás közben. A csóván belül sávonként halványodik a fény.
    if(playing){
      const hairs=240,step=Math.PI*2/hairs,hr1=R-bandW*.46,hr2=R+bandW*.46,TRAIL=Math.PI*.42,BUCKETS=12;
      const inTrail=[];for(let i=0;i<hairs;i++){const t=norm2pi(head-i*step)/TRAIL;if(t<1)inTrail.push([i,t])}
      ctx.lineWidth=Math.max(1,1.6*s);ctx.lineCap='butt';
      for(let b=0;b<BUCKETS;b++){
        const t0=b/BUCKETS,t1=(b+1)/BUCKETS;
        ctx.strokeStyle=`rgba(255,255,255,${(.95*Math.pow(1-(t0+t1)/2,1.7)).toFixed(3)})`;
        ctx.beginPath();let any=false;
        for(const [i,t] of inTrail){if(t<t0||t>=t1)continue;const a=i*step;
          ctx.moveTo(c.x+Math.cos(a)*hr1,c.y+Math.sin(a)*hr1);ctx.lineTo(c.x+Math.cos(a)*hr2,c.y+Math.sin(a)*hr2);any=true}
        if(any)ctx.stroke();
      }
    }
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(c.x,c.y,R+bandW*.60,0,Math.PI*2);ctx.stroke();
    // rácspontok: a negyedek csepp alakúak, a csúcs sugárirányban kifelé mutat (így
    // egyértelmű, hol az ütés, de a kör vonalát nem töri meg), az 1. ütés a legnagyobb.
    // A háttérszínű körvonal emeli ki őket a sávból.
    ctx.lineWidth=3*s;ctx.strokeStyle=BG;
    for(let i=0;i<total;i++){
      const a=base+i*(Math.PI*2/total),isBeat=i%subdiv===0,rr=i===0?mr.first:(isBeat?mr.beat:mr.sub);
      ctx.save();ctx.translate(c.x+Math.cos(a)*R,c.y+Math.sin(a)*R);ctx.rotate(a);
      // a gradienst visszaforgatjuk, hogy a fény minden jelölőn felülről jöjjön
      const gx=Math.sin(a)*rr,gy=Math.cos(a)*rr,g=ctx.createLinearGradient(-gx,-gy,gx,gy);
      g.addColorStop(0,`rgba(255,255,255,${groupingsMode?.52:.30})`);g.addColorStop(1,`rgba(255,255,255,${groupingsMode?.26:.12})`);ctx.fillStyle=g;
      ctx.beginPath();
      if(isBeat){const d=rr*1.55,phi=Math.acos(rr/d);ctx.arc(0,0,rr,phi,-phi);ctx.lineTo(d,0);ctx.closePath()}
      else ctx.arc(0,0,rr,0,Math.PI*2);
      ctx.fill();ctx.stroke();ctx.restore();
    }
    // --- csoportok: kapszula-körvonal + halvány belső kitöltés (a hangok alatt) ---
    const capH=bandW*.60,anyOpen=openGroupId!==null;
    ctx.lineCap='butt';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const g of groups){
      const isOpen=g.id===openGroupId,full=groupCount(g)>=totalSlots();
      const al=isOpen?.92:(anyOpen?.20:.62);
      ctx.lineWidth=(isOpen?3.4:2.2)*s;ctx.strokeStyle=`rgba(11,11,11,${al})`;
      ctx.fillStyle=isOpen?'rgba(255,255,255,.82)':`rgba(255,255,255,${anyOpen?.06:.20})`;
      if(full){ // körbeér: a kapszula bezárul önmagába, két koncentrikus gyűrűvé
        ctx.beginPath();ctx.arc(c.x,c.y,R+capH,0,Math.PI*2);ctx.arc(c.x,c.y,R-capH,0,Math.PI*2,true);ctx.fill();
        ctx.beginPath();ctx.arc(c.x,c.y,R+capH,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(c.x,c.y,R-capH,0,Math.PI*2);ctx.stroke();
      }else{capsulePath(c.x,c.y,R,capH,g.a1,g.a2);ctx.fill();ctx.stroke()}
      const mid=full?base:(g.a1+g.a2)/2,lr=R+capH+15*s;   // a szám = hány rácspontot fed le
      ctx.font=`900 ${Math.round(15*s)}px Montserrat, sans-serif`;ctx.fillStyle=`rgba(11,11,11,${al})`;
      ctx.fillText(String(groupCount(g)),c.x+Math.cos(mid)*lr,c.y+Math.sin(mid)*lr);
    }
    if(paintSel&&paintSel.moved){ // kijelölés közbeni előnézet
      const from=paintSel.acc>=0?paintSel.a0:paintSel.a0+paintSel.acc,len=Math.min(Math.abs(paintSel.acc),Math.PI*2);
      ctx.lineWidth=2.2*s;ctx.strokeStyle='rgba(11,11,11,.55)';ctx.fillStyle='rgba(255,255,255,.34)';
      capsulePath(c.x,c.y,R,capH,from,from+len);ctx.fill();ctx.stroke();
    }
    // off-grid eltérések. 100% = egy rácslépés, a viszonyítás a hang legközelebbi
    // rácspontja (így mindig ±50% között marad). Húzás közben teljes erővel látszik,
    // elengedés után halványan ott is marad.
    const devs=[];
    for(let i=0;i<notes.length;i++){
      const a=getNoteAngle(notes[i]),ga=nearestGridAngle(a),d=shortestAngleDiff(a,ga),pct=Math.round(d/gridStepAngle()*100);
      if(pct!==0)devs.push({a,ga,pct,live:!!draggingNote&&draggingNote.index===i&&!tapCandidate});
    }
    ctx.lineCap='round';ctx.lineWidth=bandW*.62;
    for(const dv of devs){ctx.strokeStyle=`rgba(11,11,11,${dv.live?.22:.13})`;drawArcShortest(dv.ga,dv.a,c.x,c.y,R)}
    for(const n of notes){const a=getNoteAngle(n),x=c.x+Math.cos(a)*R,y=c.y+Math.sin(a)*R;
      // csoportosító módban, illetve nyitott csoport mellett a többi hang halványul
      const og=anyOpen?groupById(openGroupId):null,dim=groupingsMode||(anyOpen&&!(og&&groupHas(og,a)));
      ctx.beginPath();ctx.fillStyle=n.accent?`rgba(220,40,40,${dim?.34:.98})`:`rgba(0,0,0,${dim?.32:.96})`;
      ctx.arc(x,y,nr,0,Math.PI*2);ctx.fill()}
    // az eltérés-buborékok a hangok fölé kerülnek
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${Math.round(13*s)}px Montserrat, sans-serif`;
    for(const dv of devs){
      const x=c.x+Math.cos(dv.a)*R,y=c.y+Math.sin(dv.a)*R,br=Math.max(nr,30*s);
      ctx.fillStyle=`rgba(11,11,11,${dv.live?.88:.34})`;ctx.beginPath();ctx.arc(x,y,br,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(255,255,255,${dv.live?.96:.62})`;ctx.fillText(`${dv.pct>0?'+':''}${dv.pct}%`,x,y);
    }
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.arc(c.x,c.y,innerR*.42,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.97)';const tri=innerR*.18;if(!playing){ctx.beginPath();ctx.moveTo(c.x-tri*.5,c.y-tri*.75);ctx.lineTo(c.x-tri*.5,c.y+tri*.75);ctx.lineTo(c.x+tri*.95,c.y);ctx.closePath();ctx.fill()}else{const w=tri*.45,h=tri*1.5,gap=tri*.35;roundRectPath(ctx,c.x-gap/2-w,c.y-h/2,w,h,8);ctx.fill();roundRectPath(ctx,c.x+gap/2,c.y-h/2,w,h,8);ctx.fill()}
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${Math.round(innerR*.22)}px Montserrat, sans-serif`;ctx.fillStyle='rgba(255,255,255,.40)';ctx.fillText(String(bpm),c.x,c.y+innerR*.35);ctx.font=`500 ${Math.round(innerR*.07)}px Montserrat, sans-serif`;ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillText('BPM',c.x,c.y+innerR*.48);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.42)';ctx.beginPath();ctx.moveTo(c.x-innerR*.11,c.y+innerR*.525);ctx.lineTo(c.x+innerR*.11,c.y+innerR*.525);ctx.stroke();
  }
  renderAllUI();let lastT=performance.now();function loop(now){const dt=(now-lastT)/1000;lastT=now;stepPlayback(dt,now);draw();requestAnimationFrame(loop)}requestAnimationFrame(t=>{lastT=t;loop(t)});
})();
</script>
