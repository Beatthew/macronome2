<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
  <title>Circle Grid Notes — Figma Layout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#90A9A9;
      --white:255,255,255;
      --ink:#0b0b0b;
      --safeTop: env(safe-area-inset-top, 0px);
      --safeBot: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:'Montserrat',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    body{position:fixed;inset:0;touch-action:none}
    .phone{position:relative;width:100vw;height:100svh;background:var(--bg);overflow:hidden;touch-action:none}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

    .topPickers{position:absolute;top:calc(var(--topY,98px) + var(--safeTop));left:0;right:0;display:grid;grid-template-columns:1fr 1fr;align-items:start;width:var(--topW,356px);margin:0 auto;z-index:5;pointer-events:none}
    .divider{display:none}
    .pickerBox{height:var(--pickerH,285px);display:flex;flex-direction:column;align-items:center;pointer-events:auto;touch-action:none}
    .pickerTitle{font-size:var(--titleFs,18px);letter-spacing:.07em;font-weight:400;line-height:1;color:rgba(var(--white),.92);text-transform:uppercase;margin-bottom:var(--titleMb,30px);white-space:nowrap}
    .wheel{position:relative;width:var(--wheelW,150px);height:var(--wheelH,178px);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:ns-resize}
    .wheelInner{display:flex;flex-direction:column;align-items:center;gap:var(--wheelGap,28px);transition:transform .18s ease-out;will-change:transform}
    .wheel.dragging .wheelInner{transition:none}
    .pickItem{position:relative;height:var(--pickH,44px);flex:none;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:var(--pickFs,34px);line-height:1;color:rgba(var(--white),.18);transition:opacity .16s,transform .16s,font-weight .16s,color .16s}
    .pickItem.active{color:rgba(var(--white),.98);font-weight:400;transform:scale(1.03)}
    .pickItem.near{color:rgba(var(--white),.18);font-weight:400;transform:scale(.94)}
    .subWheel .pickItem{height:var(--pickH,44px)}
    .subIcon{display:block;max-width:36px;max-height:28px;filter:brightness(0) invert(1);opacity:.28}
    .pickItem.active .subIcon{opacity:1}
    .pickItem.near .subIcon{opacity:.28}

    .bottomBar{position:absolute;left:50%;bottom:calc(var(--bottomY,69px) + var(--safeBot));transform:translateX(-50%);width:var(--bottomW,378px);height:var(--bottomH,112px);border:1px solid rgba(var(--white),.86);border-radius:var(--bottomR,56px);display:grid;grid-template-columns:1.15fr .72fr 1.15fr;overflow:hidden;z-index:8;color:rgba(var(--white),.72);background:transparent;pointer-events:auto}
    .seg{border:0;background:transparent;color:inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:left;font-size:var(--segFs,19px);line-height:1.22;letter-spacing:.05em;font-weight:400;cursor:pointer;touch-action:manipulation}
    .seg + .seg{border-left:1px solid rgba(var(--white),.68)}
    .seg.active{color:rgba(var(--white),.98);font-weight:800}
    .seg:active{transform:scale(.99)}
    .hamb{display:flex;flex-direction:column;gap:13px;align-items:center;justify-content:center}
    .menuLabel{display:none !important;flex-direction:column;align-items:center;gap:6px;font-style:italic;letter-spacing:.08em}
    .chev{width:18px;height:18px;border-right:2px solid rgba(var(--white),.9);border-bottom:2px solid rgba(var(--white),.9);transform:rotate(45deg) translate(-3px,-3px)}
    .hamb span{width:var(--hambW,42px);height:3px;border-radius:99px;background:rgba(var(--white),.90)}
    .bottomDropdown{position:absolute;left:50%;bottom:calc(var(--dropY,190px) + var(--safeBot));transform:translateX(-50%);width:196px;border-radius:20px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.12);overflow:hidden;display:none;z-index:12}
    .bottomDropdown.open{display:block}
    /* Desktop: a tárcsa balra, nagyban; a kezelőszervek jobb oldali oszlopba */
    /* A hang be/ki kapcsolója a kiválasztott elemet körülölelő gyűrű. Halkan jelzi,
       hogy gomb is, de nem vonja el a figyelmet a fő funkciótól, a görgetéstől. */
    .sndRing{position:absolute;left:50%;top:50%;width:var(--ringD,60px);height:var(--ringD,60px);
      margin:calc(var(--ringD,60px) / -2) 0 0 calc(var(--ringD,60px) / -2);
      border:1.5px solid rgba(var(--white),.22);border-radius:50%;pointer-events:none;
      transition:border-color .15s,box-shadow .15s}
    .wheel.sndOn .sndRing{border-color:rgba(var(--white),.90);background:rgba(var(--white),.14)}
    /* Desktop panel: kártya a kerekekkel, alatta a két kapcsoló, majd LIBRARY;
       a hamburger a jobb felső sarokba, a DELETE NOTES a bal alsóba kerül. */
    .desktop .topPickers{left:64%;right:auto;top:22vh;margin:0;width:min(340px,24vw);
      padding:22px 18px;border:1px solid rgba(var(--white),.20);border-radius:24px;row-gap:16px}
    .desktop .bottomBar{left:64%;right:auto;bottom:auto;
      top:calc(22vh + var(--pickerH,285px) + 68px);
      transform:none;width:min(340px,24vw);height:auto;border:none;border-radius:0;
      display:flex;gap:14px;overflow:visible}
    .desktop .bottomBar .seg{border:1px solid rgba(var(--white),.55);border-radius:20px;
      flex:1 1 0;height:86px;line-height:1.25}
    .deskBtn{display:none;position:absolute;align-items:center;justify-content:center;
      border:1px solid rgba(var(--white),.55);border-radius:20px;background:transparent;
      color:rgba(var(--white),.78);font-family:inherit;font-size:var(--segFs,19px);font-weight:700;
      letter-spacing:.06em;cursor:pointer;pointer-events:auto;z-index:8;text-align:center}
    .desktop .deskBtn{display:flex}
    .desktop #libraryBtn{left:64%;width:min(340px,24vw);height:64px;
      top:calc(22vh + var(--pickerH,285px) + 68px + 102px)}
    .desktop #deleteBtn{left:4vw;bottom:6vh;top:auto;width:132px;height:70px;font-size:15px}
    .desktop #menuBtn{position:fixed;top:4vh;right:4vw;width:92px;height:60px;border-radius:16px;
      border:1px solid rgba(var(--white),.7);flex:none;z-index:20}
    .desktop #menuBtn .hamb{gap:8px}
    .ddItem.muted{opacity:.45;pointer-events:none;display:none}
    .desktop .ddItem.muted{display:block}
    .desktop #libraryItem,.desktop #clearPatternItem,.desktop #beatClickItem{display:none}
    .desktop #gridFeelItem{display:block}
    .desktop .bottomDropdown{position:fixed;top:calc(4vh + 70px);right:4vw;left:auto;bottom:auto;
      transform:none;width:280px}
    .ddItem{padding:16px 18px;color:rgba(255,255,255,.92);font-size:15px;font-weight:700;cursor:pointer}
    .ddItem + .ddItem{border-top:1px solid rgba(255,255,255,.1)}
    .ddItem.active{background:rgba(255,255,255,.10);color:rgba(255,255,255,1)}

    .modalOverlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
    .modalOverlay.open{display:flex}
    .modal{width:min(520px,100%);border-radius:18px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden}
    .modalHeader{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.10)}
    .modalTitle{font-size:16px;color:rgba(255,255,255,.92);font-weight:800}
    .modalClose{width:40px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10);cursor:pointer;color:#fff}
    .modalBody{padding:14px 16px 16px}
    .fieldLabel{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:8px}
    input[type=text]{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.12);outline:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);font-size:16px}
    .modalActions{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mBtn{height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;font-weight:900;font-size:14px;border:1px solid rgba(255,255,255,.10)}
    .mBtn.primary{background:rgba(255,255,255,.90);color:rgba(0,0,0,.82)} .mBtn.ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)} .mBtn.danger{background:rgba(220,40,40,.90);color:#fff}
    .libList{display:flex;flex-direction:column;gap:10px} .libItem{border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px} .libName{color:rgba(255,255,255,.92);font-weight:800;font-size:15px;line-height:1.1} .libMeta{margin-top:4px;color:rgba(255,255,255,.55);font-size:12px} .libBtns{display:flex;gap:8px;flex-shrink:0} .mini{height:36px;padding:0 10px;border-radius:12px;font-size:12px} .empty{color:rgba(255,255,255,.65);font-size:14px;padding:8px 2px}
    
  </style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="c"></canvas>
  <div class="topPickers" id="topPickers">
    <div class="pickerBox tsPicker" id="tsPicker"><div class="pickerTitle">Time Signature</div><div class="wheel" id="tsWheel"></div></div>
    <div class="divider"></div>
    <div class="pickerBox subPicker" id="subPicker"><div class="pickerTitle">Subdivision</div><div class="wheel subWheel" id="subWheel"></div></div>
  </div>
  <div class="bottomDropdown" id="dropdown"><div class="ddItem" id="libraryItem">Library</div><div class="ddItem" id="beatClickItem">Beat Click</div><div class="ddItem" id="clearPatternItem">Clear</div><div class="ddItem" id="gridFeelItem">Grid Feel</div><div class="ddItem muted" id="ddSoon">Personalization — coming soon</div></div>
  <button class="deskBtn" id="libraryBtn">LIBRARY</button>
  <button class="deskBtn" id="deleteBtn">DELETE<br>NOTES</button>
  <div class="bottomBar" id="bottomBar">
    <button class="seg" id="gridSnapBtn">GRID<br>SNAP</button>
    <button class="seg menuSeg" id="menuBtn" aria-label="Menu"><span class="hamb"><span></span><span></span><span></span></span><span class="menuLabel">MENU<span class="chev"></span></span></button>
    <button class="seg" id="groupBtn">GROUP<br>NOTES</button>
  </div>
  <div class="modalOverlay" id="saveModal"><div class="modal"><div class="modalHeader"><div class="modalTitle">Save Pattern</div><div class="modalClose" id="saveClose">✕</div></div><div class="modalBody"><div class="fieldLabel">Name</div><input id="saveName" type="text" maxlength="40" placeholder="e.g. Verse A / 7-3 clave / ..." /><div class="modalActions" id="saveUpdateRow" style="grid-template-columns:1fr;display:none"><div class="mBtn primary" id="saveUpdate">Update</div></div><div class="modalActions"><div class="mBtn ghost" id="saveCancel">Cancel</div><div class="mBtn primary" id="saveConfirm">Save as new</div></div></div></div></div>
  <div class="modalOverlay" id="bpmModal"><div class="modal"><div class="modalHeader"><div class="modalTitle">Tempo</div><div class="modalClose" id="bpmClose">✕</div></div><div class="modalBody"><div class="fieldLabel">BPM (30–240)</div><input id="bpmInput" type="text" inputmode="numeric" maxlength="3" placeholder="80" /><div class="modalActions"><div class="mBtn ghost" id="bpmCancel">Cancel</div><div class="mBtn primary" id="bpmConfirm">Set</div></div></div></div></div>
  <div class="modalOverlay" id="libModal"><div class="modal"><div class="modalHeader"><div class="modalTitle">Library</div><div class="modalClose" id="libClose">✕</div></div><div class="modalBody"><div class="libList" id="libList"></div><div class="modalActions" style="grid-template-columns:1fr"><div class="mBtn primary" id="libSaveBtn">＋ Save current pattern</div></div><div class="modalActions" style="grid-template-columns:1fr"><div class="mBtn ghost" id="libCloseBtn">Close</div></div></div></div></div>
</div>
